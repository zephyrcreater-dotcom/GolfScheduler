name: Read-only headed browser diagnostic
on:
  workflow_dispatch:
    inputs:
      start_at_history:
        description: 'Open reservation history first and wait up to 30 seconds for normal verification'
        type: boolean
        default: true
      page_access_only:
        description: 'Check login/history access only; skip the separate token probe'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: doslagos-cloud-checker
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HEADLESS: 'false'
      DOSLAGOS_BROWSER_CHANNEL: chrome
      DIAGNOSTIC_HISTORY_ENTRY: ${{ inputs.start_at_history }}
      DIAGNOSTIC_PAGE_ACCESS_ONLY: ${{ inputs.page_access_only }}
      GOLF_EMAIL: ${{ secrets.GOLF_EMAIL }}
      GOLF_PASSWORD: ${{ secrets.GOLF_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
      - run: npx playwright install --with-deps chrome
      - name: Read-only page access in headed Google Chrome
        run: xvfb-run -a node src/doslagos/browser-diagnostic.js
